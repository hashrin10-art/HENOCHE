<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Hello</title>
<style>
  html, body {
    height: 100%;
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0f0f0f;
  }
  #text {
    font-family: monospace;
    font-size: 4rem;
    color: #fff;
  }
  #cursor {
    display: inline-block;
    width: 1ch;
    animation: blink 1s step-end infinite;
  }
  @keyframes blink {
    50% { opacity: 0; }
  }
</style>
</head>
<body>
  <div><span id="text"></span><span id="cursor">|</span></div>
  <script>
    const word = "Hello";
    const el = document.getElementById("text");
    let i = 0;
    function type() {
      if (i < word.length) {
        el.textContent += word.charAt(i);
        i++;
        setTimeout(type, 200);
      }
    }
    type();
  </script>
</body>
</html>
